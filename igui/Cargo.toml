[package]
name = "igui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# UI: scene + layout/paint/input + design system.
ui = [
    "dep:igui_core",
    "dep:igui_render",
    "dep:igui_scene",
    "dep:igui_theme",
    "dep:igui_ui",
    "dep:igui_components",
]
# Animation, independent of `ui` and `game`.
anim = ["dep:igui_anim", "dep:igui_core", "dep:igui_scene"]
# Application runtime: the plugin-based `igui_app` builder (no platform).
app = ["dep:igui_app", "dep:igui_core", "dep:igui_render"]
# Headless recording presenter for `--selfcheck`; no `winit`.
headless = ["app", "dep:igui_headless", "dep:igui_backend_recording"]
# 2D game layer. Does not imply `ui`; `anim` stays independent.
game = [
    "dep:igui_game",
    "dep:igui_assets",
    "dep:igui_core",
    "dep:igui_render",
    "dep:igui_scene",
]
# Native render backend (wgpu).
wgpu = ["dep:igui_backend_wgpu", "dep:igui_core", "dep:igui_render"]
# Web render backend (HTML Canvas 2D). Compiles on any target; active on wasm.
canvas = ["dep:igui_backend_canvas", "dep:igui_core", "dep:igui_render"]
# Browser glue for a Canvas app (implies `canvas`).
wasm = ["canvas", "dep:igui_wasm"]
# Backend-neutral performance inspection (`igui_profile`).
profile = ["dep:igui_profile", "dep:igui_core", "dep:igui_render"]
# Debug overlays (`igui_debug_ui`); needs the UI and implies `profile`.
debug = ["ui", "profile", "dep:igui_debug_ui"]
# Headless recording backend (tests / `--selfcheck`).
recording = ["dep:igui_backend_recording", "dep:igui_core", "dep:igui_render"]
# Benchmarks.
bench = ["dep:igui_bench", "dep:igui_bench_suite"]

[dependencies]
igui_core = { workspace = true, optional = true }
igui_render = { workspace = true, optional = true }
igui_scene = { workspace = true, optional = true }
igui_theme = { workspace = true, optional = true }
igui_ui = { workspace = true, optional = true }
igui_components = { workspace = true, optional = true }
igui_anim = { workspace = true, optional = true }
igui_game = { workspace = true, optional = true }
igui_assets = { workspace = true, optional = true }
igui_app = { workspace = true, optional = true }
igui_headless = { workspace = true, optional = true }
igui_backend_recording = { workspace = true, optional = true }
igui_backend_wgpu = { workspace = true, optional = true }
igui_backend_canvas = { workspace = true, optional = true }
igui_wasm = { workspace = true, optional = true }
igui_profile = { workspace = true, optional = true }
igui_debug_ui = { workspace = true, optional = true }
igui_bench = { workspace = true, optional = true }
igui_bench_suite = { workspace = true, optional = true }
