[workspace]
resolver = "2"
members = [
    # backend-neutral core
    "crates/core/cobbled_core",
    "crates/core/cobbled_scene",
    "crates/core/cobbled_ui",
    "crates/core/cobbled_theme",
    "crates/core/cobbled_components",
    "crates/core/cobbled_render",
    "crates/core/cobbled_font",
    "crates/core/cobbled_svg",
    "crates/core/cobbled_assets",
    "crates/core/cobbled_anim",
    "crates/core/cobbled_game",
    # concrete backends
    "crates/platform/canvas/cobbled_backend_canvas",
    "crates/platform/recording/cobbled_backend_recording",
    "crates/platform/wgpu/cobbled_backend_wgpu",
    "crates/platform/wasm/cobbled_wasm",
    # C ABI
    "crates/ffi/cobbled_ffi",
    # observability
    "crates/debug/cobbled_profile",
    "crates/debug/cobbled_debug_ui",
    # benchmarking
    "crates/bench/cobbled_bench",
    "crates/bench/cobbled_bench_suite",
    # window hosts / application runtime
    "crates/window/cobbled_winit",
    "crates/app/cobbled_app",
    "crates/app/cobbled_headless",
    "quill",
    "examples/web_demo",
    "examples/demo_app",
    "examples/demoapp_ffi",
    "examples/wgpu_ffi",
    "examples/wgpu_demo",
    "examples/game_demo",
    "examples/multi_tree",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = ""

[workspace.dependencies]
cobbled_core = { path = "crates/core/cobbled_core" }
cobbled_scene = { path = "crates/core/cobbled_scene" }
cobbled_ui = { path = "crates/core/cobbled_ui" }
cobbled_theme = { path = "crates/core/cobbled_theme" }
cobbled_components = { path = "crates/core/cobbled_components" }
cobbled_render = { path = "crates/core/cobbled_render" }
cobbled_font = { path = "crates/core/cobbled_font" }
cobbled_svg = { path = "crates/core/cobbled_svg" }
cobbled_assets = { path = "crates/core/cobbled_assets" }
cobbled_anim = { path = "crates/core/cobbled_anim" }
cobbled_game = { path = "crates/core/cobbled_game" }
cobbled_backend_canvas = { path = "crates/platform/canvas/cobbled_backend_canvas" }
cobbled_backend_recording = { path = "crates/platform/recording/cobbled_backend_recording" }
cobbled_backend_wgpu = { path = "crates/platform/wgpu/cobbled_backend_wgpu" }
cobbled_wasm = { path = "crates/platform/wasm/cobbled_wasm" }
cobbled_ffi = { path = "crates/ffi/cobbled_ffi" }
cobbled_profile = { path = "crates/debug/cobbled_profile" }
cobbled_debug_ui = { path = "crates/debug/cobbled_debug_ui" }
cobbled_bench = { path = "crates/bench/cobbled_bench" }
cobbled_bench_suite = { path = "crates/bench/cobbled_bench_suite" }
cobbled_winit = { path = "crates/window/cobbled_winit" }
cobbled_app = { path = "crates/app/cobbled_app" }
cobbled_headless = { path = "crates/app/cobbled_headless" }
demo_app = { path = "examples/demo_app" }

[profile.release]
opt-level = "s"
lto = true

# Benchmarks inherit `release` but want throughput-oriented codegen, not size.
[profile.bench]
opt-level = 3
