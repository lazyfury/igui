[workspace]
resolver = "2"
members = [
    # backend-neutral core
    "crates/core/rough_core",
    "crates/core/rough_scene",
    "crates/core/rough_ui",
    "crates/core/rough_theme",
    "crates/core/rough_components",
    "crates/core/rough_render",
    "crates/core/rough_font",
    "crates/core/rough_svg",
    "crates/core/rough_assets",
    "crates/core/rough_anim",
    "crates/core/rough_game",
    # concrete backends
    "crates/platform/canvas/rough_backend_canvas",
    "crates/platform/recording/rough_backend_recording",
    "crates/platform/wgpu/rough_backend_wgpu",
    "crates/platform/wasm/rough_wasm",
    # C ABI
    "crates/ffi/rough_ffi",
    # observability
    "crates/debug/rough_profile",
    "crates/debug/rough_debug_ui",
    # benchmarking
    "crates/bench/rough_bench",
    "crates/bench/rough_bench_suite",
    # window hosts / application runtime
    "crates/window/rough_winit",
    "crates/app/rough_app",
    "crates/app/rough_headless",
    "quill",
    "examples/web_demo",
    "examples/demo_app",
    "examples/demoapp_ffi",
    "examples/wgpu_ffi",
    "examples/wgpu_demo",
    "examples/game_demo",
    "examples/multi_tree",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = ""

[workspace.dependencies]
rough_core = { path = "crates/core/rough_core" }
rough_scene = { path = "crates/core/rough_scene" }
rough_ui = { path = "crates/core/rough_ui" }
rough_theme = { path = "crates/core/rough_theme" }
rough_components = { path = "crates/core/rough_components" }
rough_render = { path = "crates/core/rough_render" }
rough_font = { path = "crates/core/rough_font" }
rough_svg = { path = "crates/core/rough_svg" }
rough_assets = { path = "crates/core/rough_assets" }
rough_anim = { path = "crates/core/rough_anim" }
rough_game = { path = "crates/core/rough_game" }
rough_backend_canvas = { path = "crates/platform/canvas/rough_backend_canvas" }
rough_backend_recording = { path = "crates/platform/recording/rough_backend_recording" }
rough_backend_wgpu = { path = "crates/platform/wgpu/rough_backend_wgpu" }
rough_wasm = { path = "crates/platform/wasm/rough_wasm" }
rough_ffi = { path = "crates/ffi/rough_ffi" }
rough_profile = { path = "crates/debug/rough_profile" }
rough_debug_ui = { path = "crates/debug/rough_debug_ui" }
rough_bench = { path = "crates/bench/rough_bench" }
rough_bench_suite = { path = "crates/bench/rough_bench_suite" }
rough_winit = { path = "crates/window/rough_winit" }
rough_app = { path = "crates/app/rough_app" }
rough_headless = { path = "crates/app/rough_headless" }
demo_app = { path = "examples/demo_app" }

[profile.release]
opt-level = "s"
lto = true

# Benchmarks inherit `release` but want throughput-oriented codegen, not size.
[profile.bench]
opt-level = 3
