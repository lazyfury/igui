[workspace]
resolver = "2"
members = [
    # backend-neutral core
    "crates/core/draw_core",
    "crates/core/draw_scene",
    "crates/core/draw_ui",
    "crates/core/draw_theme",
    "crates/core/draw_components",
    "crates/core/draw_render",
    "crates/core/draw_font",
    "crates/core/draw_svg",
    "crates/core/draw_assets",
    "crates/core/draw_anim",
    "crates/core/draw_game",
    # concrete backends
    "crates/platform/canvas/draw_backend_canvas",
    "crates/platform/recording/draw_backend_recording",
    "crates/platform/wgpu/draw_backend_wgpu",
    "crates/platform/wasm/draw_wasm",
    # C ABI
    "crates/ffi/draw_ffi",
    # observability
    "crates/debug/draw_profile",
    "crates/debug/draw_debug_ui",
    # benchmarking
    "crates/bench/draw_bench",
    "crates/bench/draw_bench_suite",
    # window hosts / application runtime
    "crates/window/quill_winit",
    "crates/app/quill_app",
    "crates/app/quill_headless",
    "quill",
    "examples/web_demo",
    "examples/demo_app",
    "examples/demoapp_ffi",
    "examples/wgpu_ffi",
    "examples/wgpu_demo",
    "examples/game_demo",
    "examples/multi_tree",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = ""

[workspace.dependencies]
draw_core = { path = "crates/core/draw_core" }
draw_scene = { path = "crates/core/draw_scene" }
draw_ui = { path = "crates/core/draw_ui" }
draw_theme = { path = "crates/core/draw_theme" }
draw_components = { path = "crates/core/draw_components" }
draw_render = { path = "crates/core/draw_render" }
draw_font = { path = "crates/core/draw_font" }
draw_svg = { path = "crates/core/draw_svg" }
draw_assets = { path = "crates/core/draw_assets" }
draw_anim = { path = "crates/core/draw_anim" }
draw_game = { path = "crates/core/draw_game" }
draw_backend_canvas = { path = "crates/platform/canvas/draw_backend_canvas" }
draw_backend_recording = { path = "crates/platform/recording/draw_backend_recording" }
draw_backend_wgpu = { path = "crates/platform/wgpu/draw_backend_wgpu" }
draw_wasm = { path = "crates/platform/wasm/draw_wasm" }
draw_ffi = { path = "crates/ffi/draw_ffi" }
draw_profile = { path = "crates/debug/draw_profile" }
draw_debug_ui = { path = "crates/debug/draw_debug_ui" }
draw_bench = { path = "crates/bench/draw_bench" }
draw_bench_suite = { path = "crates/bench/draw_bench_suite" }
quill_winit = { path = "crates/window/quill_winit" }
quill_app = { path = "crates/app/quill_app" }
quill_headless = { path = "crates/app/quill_headless" }
demo_app = { path = "examples/demo_app" }

[profile.release]
opt-level = "s"
lto = true

# Benchmarks inherit `release` but want throughput-oriented codegen, not size.
[profile.bench]
opt-level = 3
