[workspace]
resolver = "2"
members = [
    # backend-neutral core
    "crates/core/igui_core",
    "crates/core/igui_scene",
    "crates/core/igui_ui",
    "crates/components/igui_theme",
    "crates/components/igui_components",
    "crates/core/igui_render",
    "crates/assets/igui_font",
    "crates/assets/igui_svg",
    "crates/assets/igui_assets",
    "crates/core/igui_anim",
    # concrete backends
    "crates/platform/canvas/igui_backend_canvas",
    "crates/platform/recording/igui_backend_recording",
    "crates/platform/wgpu/igui_backend_wgpu",
    "crates/platform/wasm/igui_wasm",
    # C ABI
    "crates/ffi/igui_ffi",
    # observability
    "crates/debug/igui_profile",
    "crates/debug/igui_debug_ui",
    # benchmarking
    "crates/bench/igui_bench",
    "crates/bench/igui_bench_suite",
    # window hosts / application runtime
    "crates/window/igui_winit",
    "crates/app/igui_app",
    "crates/app/igui_headless",
    "igui",
    "examples/web_demo",
    "examples/demo_app",
    "examples/demoapp_ffi",
    "examples/wgpu_ffi",
    "examples/wgpu_demo",
    "examples/multi_tree",
]

[workspace.package]
version = "0.3.1"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = ""

[workspace.dependencies]
igui_core = { path = "crates/core/igui_core" }
igui_scene = { path = "crates/core/igui_scene" }
igui_ui = { path = "crates/core/igui_ui" }
igui_theme = { path = "crates/components/igui_theme" }
igui_components = { path = "crates/components/igui_components" }
igui_render = { path = "crates/core/igui_render" }
igui_font = { path = "crates/assets/igui_font" }
igui_svg = { path = "crates/assets/igui_svg" }
igui_assets = { path = "crates/assets/igui_assets" }
igui_anim = { path = "crates/core/igui_anim" }
igui_backend_canvas = { path = "crates/platform/canvas/igui_backend_canvas" }
igui_backend_recording = { path = "crates/platform/recording/igui_backend_recording" }
igui_backend_wgpu = { path = "crates/platform/wgpu/igui_backend_wgpu" }
igui_wasm = { path = "crates/platform/wasm/igui_wasm" }
igui_ffi = { path = "crates/ffi/igui_ffi" }
igui_profile = { path = "crates/debug/igui_profile" }
igui_debug_ui = { path = "crates/debug/igui_debug_ui" }
igui_bench = { path = "crates/bench/igui_bench" }
igui_bench_suite = { path = "crates/bench/igui_bench_suite" }
igui_winit = { path = "crates/window/igui_winit" }
igui_app = { path = "crates/app/igui_app" }
igui_headless = { path = "crates/app/igui_headless" }
demo_app = { path = "examples/demo_app" }

[profile.release]
opt-level = "s"
lto = true

# Benchmarks inherit `release` but want throughput-oriented codegen, not size.
[profile.bench]
opt-level = 3
