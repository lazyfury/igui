[package]
name = "quill"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# UI: scene + layout/paint/input + design system.
ui = [
    "dep:cobbled_core",
    "dep:cobbled_render",
    "dep:cobbled_scene",
    "dep:cobbled_theme",
    "dep:cobbled_ui",
    "dep:cobbled_components",
    # When `game` is also enabled, surface `cobbled_game::GameView` (weak dep: does
    # not pull cobbled_game on by itself).
    "cobbled_game?/ui",
]
# Animation, independent of `ui` and `game`.
anim = ["dep:cobbled_anim", "dep:cobbled_core", "dep:cobbled_scene"]
# Application runtime: the plugin-based `cobbled_app` builder (no platform).
app = ["dep:cobbled_app", "dep:cobbled_core", "dep:cobbled_render"]
# Headless recording presenter for `--selfcheck`; no `winit`.
headless = ["app", "dep:cobbled_headless", "dep:cobbled_backend_recording"]
# 2D game layer. Does not imply `ui`; `anim` stays independent.
game = [
    "dep:cobbled_game",
    "dep:cobbled_assets",
    "dep:cobbled_core",
    "dep:cobbled_render",
    "dep:cobbled_scene",
]

[dependencies]
cobbled_core = { workspace = true, optional = true }
cobbled_render = { workspace = true, optional = true }
cobbled_scene = { workspace = true, optional = true }
cobbled_theme = { workspace = true, optional = true }
cobbled_ui = { workspace = true, optional = true }
cobbled_components = { workspace = true, optional = true }
cobbled_anim = { workspace = true, optional = true }
cobbled_game = { workspace = true, optional = true }
cobbled_assets = { workspace = true, optional = true }
cobbled_app = { workspace = true, optional = true }
cobbled_headless = { workspace = true, optional = true }
cobbled_backend_recording = { workspace = true, optional = true }
