[package]
name = "web_demo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cobbled_core.workspace = true
cobbled_render.workspace = true
cobbled_scene.workspace = true
cobbled_ui.workspace = true
cobbled_wasm.workspace = true
demo_app.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "CanvasRenderingContext2d"] }
