[package]
name = "multi_tree"
version = "0.1.0"
edition = "2021"
publish = false

# The only workspace member that consumes the `igui` facade, so the facade's
# feature-gated re-exports are exercised by the normal test gate (a facade with
# no consumers is an untested API).
[dependencies]
igui = { workspace = true, features = ["ui", "recording"] }
