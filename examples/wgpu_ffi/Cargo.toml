[package]
name = "wgpu_ffi"
description = "C ABI over cobbled_backend_wgpu: a foreign host hands over a window and a DrawList, and the Rust wgpu backend renders it."
version.workspace = true
edition.workspace = true
# `wgpu` 24 requires Rust 1.76, like `cobbled_backend_wgpu`.
rust-version = "1.76"
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
cobbled_core.workspace = true
cobbled_render.workspace = true
cobbled_backend_wgpu.workspace = true
cobbled_ffi.workspace = true
