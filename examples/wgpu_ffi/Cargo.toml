[package]
name = "wgpu_ffi"
description = "C ABI over igui_backend_wgpu: a foreign host hands over a window and a DrawList, and the Rust wgpu backend renders it."
version.workspace = true
edition.workspace = true
# Renders through `igui_backend_wgpu`, which needs 1.85.
rust-version = "1.85"
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
igui_core.workspace = true
igui_render.workspace = true
igui_backend_wgpu.workspace = true
igui_ffi.workspace = true
