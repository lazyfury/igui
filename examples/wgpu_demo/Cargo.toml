[package]
name = "wgpu_demo"
version.workspace = true
edition.workspace = true
# `winit`/`wgpu` 24 require newer Rust than the workspace default.
rust-version = "1.76"
license.workspace = true
publish = false

[[bin]]
name = "wgpu_demo"
path = "src/main.rs"

[dependencies]
rough_backend_wgpu.workspace = true
rough_core.workspace = true
rough_render.workspace = true
rough_scene.workspace = true
rough_ui.workspace = true
rough_profile.workspace = true
rough_debug_ui.workspace = true
demo_app.workspace = true
rough_app.workspace = true
rough_winit.workspace = true
rough_headless.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
winit = "0.30"
