[package]
name = "wgpu_demo"
version.workspace = true
edition.workspace = true
# `winit`/`wgpu` 24 require newer Rust than the workspace default.
rust-version = "1.76"
license.workspace = true
publish = false

[[bin]]
name = "wgpu_demo"
path = "src/main.rs"

[dependencies]
cobbled_backend_wgpu.workspace = true
cobbled_core.workspace = true
cobbled_render.workspace = true
cobbled_scene.workspace = true
cobbled_ui.workspace = true
cobbled_profile.workspace = true
cobbled_debug_ui.workspace = true
demo_app.workspace = true
cobbled_app.workspace = true
cobbled_winit.workspace = true
cobbled_headless.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
winit = "0.30"
