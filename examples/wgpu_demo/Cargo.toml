[package]
name = "wgpu_demo"
version.workspace = true
edition.workspace = true
# The wgpu / winit stack this demo hosts needs 1.85 (`igui_backend_wgpu`).
rust-version = "1.85"
license.workspace = true
publish = false

[[bin]]
name = "wgpu_demo"
path = "src/main.rs"

[dependencies]
igui_backend_wgpu.workspace = true
igui_core.workspace = true
igui_render.workspace = true
igui_scene.workspace = true
igui_ui.workspace = true
igui_profile.workspace = true
igui_debug_ui.workspace = true
demo_app.workspace = true
igui_app.workspace = true
igui_winit.workspace = true
igui_headless.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
winit = "0.30"
