[package]
name = "file_browser"
version = "0.1.0"
edition = "2021"
# `winit` / `wgpu` (pulled in by `igui_backend_wgpu`) need newer Rust than the
# workspace default, exactly like `examples/wgpu_demo`.
rust-version = "1.76"
publish = false

[[bin]]
name = "file_browser"
path = "src/main.rs"

[dependencies]
# The UI is built with the workspace's own layers (see AGENTS.md).
igui_core = { path = "../../crates/core/igui_core" }
igui_render = { path = "../../crates/core/igui_render" }
igui_scene = { path = "../../crates/core/igui_scene" }
igui_theme = { path = "../../crates/components/igui_theme" }
igui_ui = { path = "../../crates/core/igui_ui" }
igui_components = { path = "../../crates/components/igui_components" }
igui_backend_wgpu = { path = "../../crates/platform/wgpu/igui_backend_wgpu" }
# Headless self-check (`--selfcheck`): record draw lists + inspect them,
# so the UI can be verified without a window or a screenshot.
igui_backend_recording = { path = "../../crates/platform/recording/igui_backend_recording" }
igui_profile = { path = "../../crates/debug/igui_profile" }
winit = "0.30"

# 独立的小工具：不加入主 workspace，避免影响 cargo check --workspace 关卡。
# 它只以 path 依赖引用工作区的 crate，工作区本身看不到这个包。
[workspace]
