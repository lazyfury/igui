[package]
name = "file_browser"
version = "0.1.0"
edition = "2021"
# `winit` / `wgpu` (pulled in by `rough_backend_wgpu`) need newer Rust than the
# workspace default, exactly like `examples/wgpu_demo`.
rust-version = "1.76"
publish = false

[[bin]]
name = "file_browser"
path = "src/main.rs"

[dependencies]
# The UI is built with the workspace's own layers (see AGENTS.md).
rough_core = { path = "../../crates/core/rough_core" }
rough_render = { path = "../../crates/core/rough_render" }
rough_scene = { path = "../../crates/core/rough_scene" }
rough_theme = { path = "../../crates/core/rough_theme" }
rough_ui = { path = "../../crates/core/rough_ui" }
rough_components = { path = "../../crates/core/rough_components" }
rough_backend_wgpu = { path = "../../crates/platform/wgpu/rough_backend_wgpu" }
# Headless self-check (`--selfcheck`): record draw lists + inspect them,
# so the UI can be verified without a window or a screenshot.
rough_backend_recording = { path = "../../crates/platform/recording/rough_backend_recording" }
rough_profile = { path = "../../crates/debug/rough_profile" }
winit = "0.30"

# 独立的小工具：不加入主 workspace，避免影响 cargo check --workspace 关卡。
# 它只以 path 依赖引用工作区的 crate，工作区本身看不到这个包。
[workspace]
