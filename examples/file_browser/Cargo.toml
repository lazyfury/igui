[package]
name = "file_browser"
version = "0.1.0"
edition = "2021"
# `winit` / `wgpu` (pulled in by `cobbled_backend_wgpu`) need newer Rust than the
# workspace default, exactly like `examples/wgpu_demo`.
rust-version = "1.76"
publish = false

[[bin]]
name = "file_browser"
path = "src/main.rs"

[dependencies]
# The UI is built with the workspace's own layers (see AGENTS.md).
cobbled_core = { path = "../../crates/core/cobbled_core" }
cobbled_render = { path = "../../crates/core/cobbled_render" }
cobbled_scene = { path = "../../crates/core/cobbled_scene" }
cobbled_theme = { path = "../../crates/core/cobbled_theme" }
cobbled_ui = { path = "../../crates/core/cobbled_ui" }
cobbled_components = { path = "../../crates/core/cobbled_components" }
cobbled_backend_wgpu = { path = "../../crates/platform/wgpu/cobbled_backend_wgpu" }
# Headless self-check (`--selfcheck`): record draw lists + inspect them,
# so the UI can be verified without a window or a screenshot.
cobbled_backend_recording = { path = "../../crates/platform/recording/cobbled_backend_recording" }
cobbled_profile = { path = "../../crates/debug/cobbled_profile" }
winit = "0.30"

# 独立的小工具：不加入主 workspace，避免影响 cargo check --workspace 关卡。
# 它只以 path 依赖引用工作区的 crate，工作区本身看不到这个包。
[workspace]
