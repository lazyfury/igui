[package]
name = "quill_winit"
version.workspace = true
edition.workspace = true
# `winit` / `wgpu` (pulled in by `draw_backend_wgpu`) need a newer Rust than
# the workspace default, exactly like `examples/wgpu_demo`.
rust-version = "1.76"
license.workspace = true
description = "Shared winit + wgpu window hosting for quill apps."
publish = false

[dependencies]
draw_core.workspace = true
draw_render.workspace = true
draw_scene.workspace = true
draw_ui.workspace = true
draw_backend_wgpu.workspace = true
winit = "0.30"
# System clipboard for text-field copy / cut / paste; falls back to an
# in-process clipboard when the platform has none (headless / sandboxed).
arboard = "3"
