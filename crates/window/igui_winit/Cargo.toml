[package]
name = "igui_winit"
version.workspace = true
edition.workspace = true
# Pulls `igui_backend_wgpu`, which needs 1.85 for its dependency graph.
rust-version = "1.85"
license.workspace = true
description = "Shared winit + wgpu window hosting for igui apps."
publish = false

[dependencies]
igui_core.workspace = true
igui_render.workspace = true
igui_ui.workspace = true
igui_backend_wgpu.workspace = true
igui_app.workspace = true
winit = "0.30"
# System clipboard for text-field copy / cut / paste; falls back to an
# in-process clipboard when the platform has none (headless / sandboxed).
# Default features drag in `image` (for image-clipboard support this crate never
# uses), which alone would raise the required Rust far above the workspace MSRV.
arboard = { version = "3", default-features = false }
