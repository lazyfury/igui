[package]
name = "cobbled_backend_wgpu"
version.workspace = true
edition.workspace = true
# `wgpu` 24 requires Rust 1.76, so this crate opts out of the workspace's 1.75.
rust-version = "1.76"
license.workspace = true

[dependencies]
cobbled_core.workspace = true
cobbled_render.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cobbled_font.workspace = true
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
wgpu = "24"

[dev-dependencies]
cobbled_scene.workspace = true
cobbled_bench.workspace = true
font8x8 = "0.3"

[[bench]]
name = "wgpu"
harness = false
