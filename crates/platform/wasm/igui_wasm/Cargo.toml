[package]
name = "igui_wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
igui_core.workspace = true
igui_render.workspace = true
igui_ui.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
igui_backend_canvas.workspace = true
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlElement",
    "CssStyleDeclaration",
    "CanvasRenderingContext2d",
    "TextMetrics",
    "PointerEvent",
    "WheelEvent",
    "KeyboardEvent",
    "Event",
    "EventTarget",
    "DomRect",
] }
