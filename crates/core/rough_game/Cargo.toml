[package]
name = "cobbled_game"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# Embedded game viewport (`GameView`) hosted in a `cobbled_ui` tree.
ui = ["dep:cobbled_ui"]

[dependencies]
cobbled_core.workspace = true
cobbled_render.workspace = true
cobbled_scene.workspace = true
cobbled_assets.workspace = true
